name: Offline API and credential dialog checks
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-aws.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: python tests/browser_credentials_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-dialog-screenshots
          path: /tmp/tts-lab-credentials-*.png
          if-no-files-found: ignore
