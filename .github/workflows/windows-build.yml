name: Build Windows installer and portable release
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['tauri-migration']
    tags: ['v*']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $code = @'
          import ast, json, os, re, tomllib
          from pathlib import Path
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          version = package['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Installer requires a three-part numeric version'
          npm_lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text(encoding='utf-8'))
          cargo_lock = tomllib.loads(Path('src-tauri/Cargo.lock').read_text(encoding='utf-8'))
          native_packages = [p for p in cargo_lock['package'] if p['name'] == cargo['package']['name'] and 'source' not in p]
          assert len(native_packages) == 1, 'Cargo.lock must contain exactly one local desktop package'
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          module = ast.parse(Path('tts_lab/app.py').read_text(encoding='utf-8'))
          state = next(node for node in module.body if isinstance(node, ast.FunctionDef) and node.name == 'state')
          result = next(node.value for node in ast.walk(state) if isinstance(node, ast.Return))
          api_version = next(ast.literal_eval(value) for key, value in zip(result.keys, result.values) if isinstance(key, ast.Constant) and key.value == 'version')
          versions = {'package-lock.json': npm_lock['version'], 'package-lock.json root': npm_lock['packages']['']['version'], 'Cargo.toml': cargo['package']['version'], 'Cargo.lock': native_packages[0]['version'], 'tauri.conf.json': tauri['version'], 'Python /api/state': api_version}
          mismatches = {name: value for name, value in versions.items() if value != version}
          assert not mismatches, f'Application versions must match package.json {version}: {mismatches}'
          assert os.environ['REF_TYPE'] != 'tag' or os.environ['REF_NAME'] == 'v' + version, 'Tag must match package.json version'
          print(f'All application versions match {version}')
          '@
          python -c $code
      - name: Install NSIS compiler
        run: choco install nsis --version=3.11 --no-progress -y
      - name: Check installer compiler paths
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Prepare bundled frontend
        run: |
          npm ci
          python scripts/prepare_frontend.py
          python -m pip install -r requirements.txt
      - name: Test and compile Tauri desktop
        working-directory: src-tauri
        run: |
          $env:TTS_LAB_PYTHON = (Get-Command python).Source
          cargo test --locked --features custom-protocol --target x86_64-pc-windows-msvc
          cargo build --release --locked --features custom-protocol --target x86_64-pc-windows-msvc
      - name: Generate Rust third-party license notices
        run: python scripts/third_party_notices.py
      - name: Build hash-locked installer and portable ZIP
        run: python scripts/build_windows.py --desktop-exe src-tauri/target/x86_64-pc-windows-msvc/release/tts-lab.exe --installer
      - name: Check bundled Python backend and offline audio
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          TTS_LAB_DESKTOP: '0'
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $bundle = Join-Path (Get-Location) "dist/TTS-Lab-$version-win-x64"
          $env:TTS_LAB_DATA_DIR = Join-Path $env:RUNNER_TEMP "tts-lab-backend-check/data"
          $env:TTS_LAB_MODELS_DIR = Join-Path $env:RUNNER_TEMP "tts-lab-backend-check/models"
          $code = @'
          import asyncio, io, sys, wave
          from pathlib import Path
          from tts_lab import app, reference_audio
          from tts_lab.providers import _wav, synthesize
          state = app.state()
          assert app.ROOT.resolve() == (Path(sys.argv[2]) / 'resources/backend/tts_lab').resolve()
          assert state['version'] == sys.argv[1], state['version']
          assert {'mimo', 'doubao', 'stepfun', 'fish', 'local_indextts', 'local_glmtts'} <= {item['id'] for item in state['providers']}
          audio = asyncio.run(synthesize('demo', 'offline Windows backend check', {}))
          with wave.open(io.BytesIO(audio.audio), 'rb') as reader:
              assert reader.getnframes() > 0 and reader.getsampwidth() == 2
          ref = reference_audio.save(_wav(b'\x00\x01' * 72000), 'reference.wav')
          assert reference_audio.info(ref['id'])['sha256'] == ref['sha256']
          print('Bundled Windows Python backend, demo WAV and private reference storage passed.')
          '@
          & "$bundle/resources/python/python.exe" -c $code $version $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native installer lifecycle and preserved user files
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/check_windows_installer.ps1 -Bundle "dist/TTS-Lab-$version-win-x64" -Installer "dist/TTS-Lab-$version-win-x64-setup.exe"
      - name: Check native Tauri desktop and exports
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $bundle = Join-Path (Get-Location) "dist/TTS-Lab-$version-win-x64"
          $report = Join-Path $env:RUNNER_TEMP "tts-lab-desktop-smoke.json"
          $arguments = @('--smoke-test', '--smoke-output', ('"' + $report + '"'))
          $process = Start-Process -FilePath "$bundle/TTS Lab.exe" -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw "Native desktop smoke test timed out"
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Native desktop smoke failed ($($process.ExitCode))" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw "Desktop smoke report did not pass" }
          Get-Content $report
      - name: Check native online update application and user-file preservation
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/check_windows_updates.ps1 -Bundle "dist/TTS-Lab-$version-win-x64" -Installer "dist/TTS-Lab-$version-win-x64-setup.exe" -PortableZIP "dist/TTS-Lab-$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TTS-Lab-Windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TTS-Lab-Windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          本次更新：
          - 新增桌面应用在线更新：可手动检查，默认启动时每天最多检查一次，可关闭自动检查。
          - 检查不会自动下载或安装；点击下载并通过长度与 SHA256 校验后，可在任务结束时安装并重启。
          - 安装版通过安装器升级，便携版原地替换应用文件，保留方案、凭证、历史音频、本地模型与其他用户文件。
          - 沿用 0.6.0 的方案、历史与模型数据格式和用户目录，保留 Tauri 2 桌面、Python 后端及所有已有 TTS 服务接入。

          下载与安装：
          - setup.exe：Windows 10/11 x64 当前用户安装；已有 WebView2 时直接复用，缺少时需联网安装 Microsoft WebView2。
          - win-x64.zip：完整解压后运行 TTS Lab.exe，需已安装 Microsoft WebView2 Evergreen Runtime；保留旁边所有文件。
          - 两种版本均包含 Python 和应用依赖；本地人声模型与推理环境按需另行下载，升级保留个人配置和历史。
          - exe.sha256 / zip.sha256：对应下载文件的 SHA256 校验值。
          - 已发布的 0.6.0 没有在线更新功能，需先手动安装本版本一次；之后可从“模型配置”的“应用更新”中升级。
          - 更新源为本项目 GitHub Release，使用 HTTPS 与 SHA256；当前发布渠道没有独立更新签名。

          验证：Windows 工作流执行 Rust 测试、Tauri release 编译、安装器编译、锁定依赖及包完整性校验，使用包内 Python 验证后端、离线 WAV 和参考录音存储，并执行原生桌面离线冒烟检查。更新辅助程序使用已发布 0.6.0 的安装版与便携包测试两种升级、完整载荷与用户文件保留，以及无效包在开始替换前的拒绝。真实云端调用、完整 GPU 推理及交互式安装体验仍需单独验证。云端调用可能收费；离线测试音不是人声。应用未做代码签名。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace published assets." >&2
            exit 1
          else
            # Keep the updater's latest-release endpoint on the previous complete
            # release until all new assets have finished uploading.
            gh release create "$RELEASE_TAG" dist/*.zip dist/*-setup.exe dist/*.sha256 --draft --verify-tag --title "TTS Lab $RELEASE_TAG" --notes-file release-notes.md
            gh release view "$RELEASE_TAG" --json assets > draft-release-assets.json
            python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          prefix = f'TTS-Lab-{version}-win-x64'
          expected = {prefix + '.zip', prefix + '.zip.sha256', prefix + '-setup.exe', prefix + '-setup.exe.sha256'}
          assets = json.loads(Path('draft-release-assets.json').read_text(encoding='utf-8'))['assets']
          assert len(assets) == 4 and {asset['name'] for asset in assets} == expected, 'Draft must contain exactly the four release assets'
          assert all(asset.get('size', 0) > 0 for asset in assets), 'Draft release assets must finish uploading before publication'
          PY
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
